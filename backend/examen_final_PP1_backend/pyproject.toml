[project]
name = "examen-final-pp1-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.20.1",
    "fastapi-pagination>=0.16.1",
    "fastapi[standard]>=0.159.1",
    "sqlalchemy>=2.1.6",
    "sqlmodel>=0.0.48",
]

[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[tool.fastapi]
entrypoint = "app.main:app"